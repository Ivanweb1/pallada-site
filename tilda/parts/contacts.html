<main>
  <section class="contacts-page">
    <div class="container contacts-page__grid">

      <div class="contacts-page__info">
        <div class="contacts-page__row">
          <div class="contacts-page__label">Телефон</div>
          <div class="contacts-page__phones">
            <a class="contacts-page__value" href="tel:88123634961">8 (812) 363-49-61</a>
          </div>
        </div>

        <div class="contacts-page__row">
          <div class="contacts-page__label">Адрес производства</div>
          <a class="contacts-page__value" target="_blank" rel="noopener"
             href="https://yandex.ru/maps/?ll=37.938946%2C55.755863&mode=routes&rtext=~55.701678%2C38.957823&rtt=auto&z=9.45">Ликино-Дулёво, ул. Ленина, д. 15А</a>
        </div>

        <div class="contacts-page__row">
          <div class="contacts-page__label">Реставрационные мастерские</div>
          <a class="contacts-page__value" target="_blank" rel="noopener"
             href="https://yandex.ru/maps/?ll=34.601528%2C57.721782&mode=routes&rtext=~59.877913%2C30.242718&rtt=auto&z=6.6">Санкт-Петербург, Корабельная ул., д. 6 корп. 4</a>
        </div>

        <div class="contacts-page__row">
          <div class="contacts-page__label">E-mail</div>
          <a class="contacts-page__value" href="mailto:info@pallada-afina.ru">info@pallada-afina.ru</a>
        </div>

        <div class="contacts-page__socials">
          <a class="social" href="https://t.me/palladacompany" target="_blank" rel="noopener">
            <img src="https://ivanweb1.github.io/pallada-site/assets/img/3963303_free-icon-telegram-4.png" alt="" width="20" height="20">
            <span class="social__full">Написать в Telegram</span><span class="social__short">Telegram</span>
          </a>
        </div>
      </div>

      <div class="contacts-page__form-wrap">
        <form class="cform cform--stacked js-cform" action="#" method="post" novalidate>
          <label class="cform__field">
            <input type="text" name="name" placeholder="Имя" autocomplete="name" required>
          </label>
          <label class="cform__field cform__field--phone">
            <span class="cform__flag" aria-hidden="true">RU</span>
            <input type="tel" name="phone" placeholder="+7 (000) 000-00-00" autocomplete="tel">
          </label>
          <label class="cform__field cform__field--wide">
            <input type="email" name="email" placeholder="E-mail" autocomplete="email" required>
          </label>
          <label class="cform__field cform__field--wide cform__field--area">
            <textarea name="comment" placeholder="Комментарий" rows="3"></textarea>
          </label>

          <label class="cform__file">
            <input type="file" name="file" class="js-cform-file">
            <span class="cform__file-btn">Прикрепить файл</span>
            <span class="cform__file-name js-cform-filename">Файл не выбран</span>
          </label>

          <label class="cform__agree">
            <input type="checkbox" name="agree" required checked>
            <span>Согласен на обработку персональных данных</span>
          </label>

          <button class="cform__submit" type="submit">Отправить</button>
          <p class="cform__done js-cform-done" hidden>Спасибо! Заявка отправлена — мы свяжемся с вами.</p>
        </form>
      </div>

    </div>
  </section>
</main>
